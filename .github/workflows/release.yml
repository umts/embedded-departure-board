name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag'
        required: true
        type: string
  workflow_call:
    inputs:
      version_tag:
        description: 'Version tag'
        required: true
        type: string

jobs:
  build:
    uses: umts/embedded-departure-board/.github/workflows/build.yml@main
    with:
      release_build: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      version_tag: ${{ inputs.version_tag }}

    steps:
      - name: Update curl and jq
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Check for existing release
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          api="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${version_tag}"

          # fetch release, capture HTTP status and body
          http_code=$(curl -sS -w "%{http_code}" -o release.json \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")

          if [ "$http_code" -eq 200 ]; then
            upload_url=$(jq -r '.upload_url // empty' release.json)
            # strip the template portion like "{?name,label}" so upload_url is usable
            upload_url="${upload_url%\{*}"
            html_url=$(jq -r '.html_url // empty' release.json)

            echo "upload_url=$upload_url" >> "$GITHUB_ENV"
            echo "Found release [$version_tag]($html_url)" >> $GITHUB_STEP_SUMMARY
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$http_code" -eq 404 ]; then
            echo "No release matching tag $version_tag found" >> $GITHUB_STEP_SUMMARY
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP $http_code from GitHub API" >> $GITHUB_STEP_SUMMARY
            cat release.json >> $GITHUB_STEP_SUMMARY
            # treat unexpected responses as needing a release (or change logic if you prefer)
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: ${{ steps.check_release.outputs.needs_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: main
        run: |
          http_code=$(curl -sS -w "%{http_code}" -o release.json \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"tag_name":"'"${version_tag}"'","target_commitish":"'"${BRANCH}"'","body":"___This release was automatically generated when the app version increased___","draft":false,"prerelease":false}' \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases")

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            upload_url=$(jq -r '.upload_url // empty' release.json)
            upload_url="${upload_url%\{*}"
            echo "upload_url=$upload_url" >> "$GITHUB_ENV"

            html_url=$(jq -r '.html_url // empty' release.json)
            echo "Created release [$version_tag]($html_url)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Failed to create release (HTTP $http_code)" >> $GITHUB_STEP_SUMMARY
            cat release.json >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Upload merged.hex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          "${{ env.upload_url }}?name=${{ env.BRANCH }}_merged.hex" \
          --data-binary "@merged.hex"
          echo 'Uploaded build artifact ${{ env.BRANCH }}_merged.hex as asset to release' >> $GITHUB_STEP_SUMMARY

      - name: Upload merged_sha256.sum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          sha256sum merged.hex > merged_sha256.sum
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          "${{ env.upload_url }}?name=${{ env.BRANCH }}_merged_sha256.sum" \
          --data-binary "@merged_sha256.sum"
          echo 'Uploaded build artifact ${{ env.BRANCH }}_merged_sha256.sum as asset to release' >> $GITHUB_STEP_SUMMARY

      - name: Upload zephyr.signed.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          "${{ env.upload_url }}?name=${{ env.BRANCH }}_zephyr.signed.bin" \
          --data-binary "@zephyr.signed.bin"
          echo 'Uploaded build artifact ${{ env.BRANCH }}_zephyr.signed.bin as asset to release' >> $GITHUB_STEP_SUMMARY

      - name: Upload zephyr_signed_bin_sha256.sum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          sha256sum zephyr.signed.bin > zephyr_signed_bin_sha256.sum
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          "${{ env.upload_url }}?name=${{ env.BRANCH }}_zephyr_signed_bin_sha256.sum" \
          --data-binary "@zephyr_signed_bin_sha256.sum"
          echo 'Uploaded build artifact ${{ env.BRANCH }}_zephyr_signed_bin_sha256.sum as asset to release' >> $GITHUB_STEP_SUMMARY
