# Hardening
CONFIG_STACK_SENTINEL=n
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# External SPI Flash (MCUboot secondary slot lives here -- see this board's
# overlay for the devicetree partition nodes; no Partition Manager needed)
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Allow writing to the flash at runtime
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Neopixels over SPI
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# NRF Modem configurations
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_FAULT_STRERROR=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_MODEM_KEY_MGMT=n

# Align the max FD entry to NRF_MODEM_MAX_SOCKET_COUNT(8)
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Occasionally the TLS setup take a long time and we don't want to reset just for that
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000

# NRF LTE link control library
CONFIG_LTE_LINK_CONTROL=y

# LTE Power Saving Mode
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
# Request periodic TAU of 12 hours
CONFIG_LTE_PSM_REQ_RPTAU="00101100"
# Set Requested Active Time (RAT) to 10 seconds.
CONFIG_LTE_PSM_REQ_RAT="00000101"

# NRF net configurations
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# Disable Duplicate Address Detection (DAD), not properly implemented for offloaded interfaces
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# TF-M configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# TF-M flash memory region sizing now comes from this board's devicetree
# overlay (slot0_s_partition/slot0_ns_partition) instead of Partition
# Manager's CONFIG_PM_PARTITION_SIZE_TFM*; the secure/nonsecure SRAM split
# uses NCS 3.4.0's own stock default (see zephyr/dts/vendor/nordic/
# nrf91xx_partition.dtsi) rather than the old hand-tuned 64K/192K PM split --
# a build-time RAM overflow is the fast, unambiguous signal if that default
# doesn't leave enough nonsecure RAM for this app.

# TF-M logging requirements
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y

# Crypto drivers
# NCS 3.4.0 made NRF_SECURITY a def_bool derived from BUILD_WITH_TFM (already
# =y above) -- no longer directly settable in a .conf file.
# CONFIG_NORDIC_SECURITY_BACKEND=y
# MBEDTLS_LEGACY_CRYPTO_C no longer exists in NCS 3.4.0 (the legacy per-
# primitive mbedtls config layer below was fully replaced by TF-PSA-Crypto /
# the PSA_WANT_* symbols -- see this file's crypto config section).
# CONFIG_MBEDTLS_USE_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
# CONFIG_MBEDTLS_LIBRARY_NRF_SECURITY=y

# Enable MbedTLS
CONFIG_MBEDTLS=y

# CONFIG_CC3XX_BACKEND=y
# MbedTLS configurations
CONFIG_MBEDTLS_ENABLE_HEAP=y
## Heap size needs to be at least SSL_IN_CONTENT_LEN + SSL_OUT_CONTENT_LEN + 32768 for HTTPS
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=16384

# MbedTLS net configurations
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=8

# MBEDTLS_TLS_LIBRARY/MBEDTLS_X509_LIBRARY are promptless aggregate flags in
# NCS 3.4.0 (nrf/subsys/nrf_security/Kconfig.tls) -- default-derived from
# NET_SOCKETS_SOCKOPT_TLS/MBEDTLS_ECDSA_C (both already =y here), no longer
# directly settable.

# Enable TLS credentials management subsystem
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y

# MbedTLS module configurations
# MBEDTLS_PSA_CRYPTO_C depends on !BUILD_WITH_TFM (already =y above) as of
# NCS 3.4.0 -- TF-M provides its own PSA crypto service instead.
#
# NCS 3.4.0 fully replaced the legacy per-primitive mbedtls config layer
# (MBEDTLS_AES_C/ECDH_C/ECDSA_C/CIPHER_C/SHA*_C/CHACHA20_C/POLY1305_C/
# CHACHAPOLY_C/HKDF_C/ECDSA_DETERMINISTIC/DHM_C/CIPHER_PADDING_*/
# MAC_SHA256_ENABLED/CMAC_C/ECP_DP_SECP256R1_ENABLED/
# KEY_EXCHANGE_ECDH_ECDSA_ENABLED/LEGACY_CRYPTO_C/PK_PARSE_EC_EXTENDED) with
# TF-PSA-Crypto (nrf/subsys/nrf_security/Kconfig.tf-psa-crypto.deprecated) --
# every one of those symbols is now either undefined or forced regardless of
# what's assigned here (both confirmed via real Kconfig warnings). The
# PSA_WANT_* section below is the actual, still-live equivalent, already
# present in this file from before this bump.
CONFIG_MBEDTLS_PK_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y
# CONFIG_MBEDTLS_GCM_C=y
# CONFIG_MBEDTLS_ECP_C=y
# CONFIG_MBEDTLS_CTR_DRBG_USE_128_BIT_KEY=y
# CONFIG_MBEDTLS_ASN1_PARSE_C=y

CONFIG_MBEDTLS_SSL_SRV_C=n
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_MBEDTLS_CCM_C=n
CONFIG_MBEDTLS_HMAC_DRBG_C=n
CONFIG_MBEDTLS_CIPHER_MODE_CBC=n
CONFIG_MBEDTLS_CIPHER_MODE_CTR=n

# Key exchange configurations
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=n

# Key type configurations
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# Cipher configurations
CONFIG_PSA_WANT_ALG_CTR=y
# PSA_WANT_ALG_STREAM_CIPHER needs PSA_WANT_KEY_TYPE_(X)CHACHA20, which this
# app doesn't use -- dropped rather than left as an always-unsatisfied 'y'.

CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=n

# Key agreement configurations
CONFIG_PSA_WANT_ALG_ECDH=y

# Key derivation function configurations
CONFIG_PSA_WANT_ALG_TLS12_PRF=n
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=n

# MAC configurations
CONFIG_PSA_WANT_ALG_HMAC=y

# AEAD configurations
CONFIG_PSA_WANT_ALG_GCM=y

# Asymmetric signature configurations
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# ECC curve configurations
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# RNG configurations
CONFIG_PSA_WANT_ALG_CTR_DRBG=y

# Enable SNI
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

# Enable SSL renegotiation
CONFIG_MBEDTLS_SSL_RENEGOTIATION=y

# Enable SSL session tickets
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y

# Enable Mbed TLS logs
CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_DEBUG_C=y
# CONFIG_MBEDTLS_DEBUG_LEVEL=1
CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
CONFIG_MBEDTLS_SSL_DEBUG_ALL=y

# Debugging
CONFIG_TLS_CREDENTIALS_LOG_LEVEL_DBG=y
# CONFIG_LTE_LINK_CONTROL_LOG_LEVEL_DBG=y
# CONFIG_NRF_MODEM_LIB_LOG_LEVEL_DBG=y
# CONFIG_NRF_MODEM_LIB_MEM_DIAG=y
# CONFIG_NRF_MODEM_LIB_MEM_DIAG_ALLOC=y
# CONFIG_NRF_MODEM_LIB_MEM_DIAG_DUMP=y
# CONFIG_NRF_MODEM_LIB_MEM_DIAG_DUMP_PERIOD_MS=10000
# CONFIG_NVS_LOG_LEVEL_DBG=y
