# Core should be on a clean state when TF-M starts
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=y

# Increase MCUboot image sectors and set static partition size
# NCS 3.4.0 added BOOT_MAX_IMG_SECTORS_AUTO (on by default), which computes
# this value itself and conflicts with an explicit override unless disabled.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# NCS 3.4.0 deprecated the non-PSA ECDSA backends (CC310/tinycrypt/oberon);
# see the debug board conf's comment for why this is needed on this SoC.
CONFIG_PSA_CRYPTO=y
CONFIG_BOOT_ECDSA_PSA=y

# Multithreading
CONFIG_MULTITHREADING=y

# Enable flash operations
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y

# Enable serial recovery
CONFIG_SERIAL=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# SPI Flash (secondary slot lives here -- see the app/mcuboot overlays'
# w25q32jv partition nodes; no Partition Manager options needed anymore)
CONFIG_SPI=y
CONFIG_NVS=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Console
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Logging
CONFIG_LOG=n
