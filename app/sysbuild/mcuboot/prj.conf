## This is a copy of the supplied default MCUBoot Zephyr prj.conf. The original file is
## found at 'bootloader/mcuboot/boot/zephyr/prj.conf' after running `west update`.
## Sysbuild requires this file and a git doesn't like symlinks to non-existing files.

CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

### mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set

CONFIG_FLASH=y
CONFIG_FPROTECT=y

### Various Zephyr boards enable features that we don't want.
# CONFIG_BT is not set
# CONFIG_I2C is not set

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y # former CONFIG_MODE_MINIMAL
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0
### Use info log level by default
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
### Use picolibc to reduce flash usage (NCS 3.4.0 stock default, replacing
### the old MINIMAL_LIBC choice; matches the app image's own CONFIG_PICOLIBC)
CONFIG_PICOLIBC=y
### Disable malloc arena because we don't need it
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0

CONFIG_NCS_BOOT_BANNER=n

CONFIG_DEBUG=n

CONFIG_SIZE_OPTIMIZATIONS=y

# Size trims to fit the 64 KB boot_partition after the NCS 3.4 PSA-crypto
# ECDSA backend growth: no banners/early console, warning-level log strings.
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
