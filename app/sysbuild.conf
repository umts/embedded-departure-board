SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# The external-flash MCUboot secondary slot is now declared purely via
# devicetree (see app/boards/circuitdojo_feather_nrf9160_ns.overlay) rather
# than through the legacy Partition Manager sysbuild options this used to set
# (SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY / _OVERRIDE_EXTERNAL_DRIVER_CHECK)
# -- NCS 3.4.0 marked SB_CONFIG_PARTITION_MANAGER itself [DEPRECATED], and this
# project's Kconfig-warnings-are-fatal build treats enabling any deprecated
# symbol as a hard failure.
